# BGM Lab news feed. Newest item at the TOP: the homepage shows the first five,
# and news.qmd shows everything, grouped by the year at the end of `when`.
#
# What goes in here:
#   - accepted papers and preprints we want to highlight
#   - software releases: new packages and minor/major versions (not patch releases)
#   - awards, grants, and prizes
#   - people joining or leaving the lab, PhD defences
#   - workshops, symposia, and tutorials the lab organises
#   - vacancies
# Keep each item to one or two sentences with a link. Whoever is involved adds the
# item within a week; [name] checks the feed once a month.
#
# Fields:
#   when:  shown as the date, free text ("Aug 2026", "4 Aug 2026"); end with the year
#   title: short headline
#   text:  one or two sentences, Markdown allowed

- when: "Sep 2026"
  title: "easybgm 0.5 on CRAN"
  text: "A new release of [easybgm](https://cran.r-project.org/package=easybgm) is on CRAN."

- when: "Aug 2026"
  title: "bgms 0.2.0.0 on CRAN"
  text: "The biggest [bgms](https://bayesian-graphical-modelling-lab.github.io/bgms/) release so far: Gaussian and mixed binary, ordinal, and continuous networks, a parallel NUTS sampler, and `prior_sensitivity_check()`. See the [release notes](https://bayesian-graphical-modelling-lab.github.io/bgms/news.html)."

- when: "May 2026"
  title: "bvarnet on CRAN"
  text: "Florian's R package [bvarnet](https://flo1met.github.io/bvarnet/) for Bayesian multilevel VAR models with Gaussian, binary, and ordinal outcomes is now on CRAN."

