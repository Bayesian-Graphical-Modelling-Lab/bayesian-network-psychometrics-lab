# ------------------------------------------------------------------ Researchers

- name: Maarten Marsman
  role: Assistant Professor · Principal Investigator
  affiliation: Psychological Methods, University of Amsterdam
  group: current
  photo: images/team/maarten.jpg
  email: m.marsman@uva.nl
  website: https://www.maartenmarsman.com
  scholar: https://scholar.google.com/citations?user=WgN2S4sAAAAJ&hl=en
  github: https://github.com/MaartenMarsman
  bio: "I am an Assistant Professor at the Psychological Methods Unit of the University of Amsterdam and Principal Investigator of the Bayesian Graphical Modeling project. My work combines psychometric theory with Bayesian inference and computational methods, focusing on Bayesian analysis of psychological data in general and graphical network models in particular."

- name: Giuseppe Arena
  role: Postdoctoral Researcher
  affiliation: Psychological Methods, University of Amsterdam
  group: current
  photo: images/team/giuseppe.jpg
  email: g.arena@uva.nl
  website: https://giuseppearena.com
  github: https://github.com/jupepis
  bio: "I am a Postdoctoral Researcher at the Psychological Methods Unit of the University of Amsterdam. I work on Bayesian methods for model selection and inference on psychometric data using Bayesian graphical models, in particular MCMC methods and novel computational techniques. My other interests include (longitudinal) social network models, time-sensitive models of social interaction, and network models for biological and genetic processes."

- name: Nikola Sekulovski
  role: Postdoctoral Researcher
  affiliation: Psychological Methods, University of Amsterdam
  group: current
  photo: images/team/nikola.jpg
