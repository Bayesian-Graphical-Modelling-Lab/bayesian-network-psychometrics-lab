  website: https://nikolasekulovski.com
  scholar: https://scholar.google.com/citations?user=cn5deUoAAAAJ&hl=en
  github: https://github.com/sekulovskin
  bio: "I am a postdoctoral researcher in the lab, specializing in Bayesian methods for analyzing graphical models applied to cross-sectional psychological data. My research interests are Bayesian hypothesis testing and network psychometrics."

