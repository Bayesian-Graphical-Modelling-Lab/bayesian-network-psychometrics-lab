- name: Don van den Bergh
  role: Postdoctoral Researcher
  affiliation: Psychological Methods, University of Amsterdam
  group: affiliated
  photo: images/team/don.jpg
  email: d.vandenbergh@uva.nl
  scholar: https://scholar.google.nl/citations?user=WbbKtuQAAAAJ&hl=en
  github: https://github.com/vandenman
  bio: "My research centers on Bayesian graphical models (mostly the Gaussian graphical model and variants of the Ising model) and general Bayesian inference (e.g., Bayesian regression and ANOVA). I am very interested in Markov chain Monte Carlo methods, especially those that work well with discrete parameters. I also contribute to JASP, an open-source statistical software program."

